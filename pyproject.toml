[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-agent-cli"
version = "0.1.5"
description = "Standalone terminal agent for OpenRouter with tool actions and context management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0.53",
    "pyunbrowser>=0.0.21",
    "rich>=15.0.0",
]

[project.optional-dependencies]
unbrowser = [
    "pyunbrowser>=0.0.21",
    "openai>=1.0",
    "python-dotenv>=1.2.3",
]
viz = ["matplotlib"]
full = [
    "pyunbrowser>=0.0.21",
    "openai>=1.0",
    "python-dotenv>=1.2.3",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/protostatis/openrouter-agent-cli"
Repository = "https://github.com/protostatis/openrouter-agent-cli"

[project.scripts]
openrouter-agent = "openrouter_agent_cli.cli:main"

[tool.setuptools]
packages = ["openrouter_agent_cli"]
