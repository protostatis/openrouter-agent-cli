[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-agent-cli"
version = "0.1.6"
description = "Standalone terminal agent for OpenRouter with tool actions and context management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0.53",
    "pyunbrowser>=0.0.21",
    "rich>=15.0.0",
]

[project.optional-dependencies]
unbrowser = [
    "pyunbrowser>=0.0.21",
    "openai>=1.0",
    "python-dotenv>=1.2.3",
]
viz = ["matplotlib"]
full = [
    "pyunbrowser>=0.0.21",
    "openai>=1.0",
    "python-dotenv>=1.2.3",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/protostatis/openrouter-agent-cli"
Repository = "https://github.com/protostatis/openrouter-agent-cli"

[project.scripts]
openrouter-agent = "openrouter_agent_cli.cli:main"
openrouter-agent-eval = "openrouter_agent_cli.eval.cli:main"
openrouter-agent-eval-audit = "openrouter_agent_cli.eval.audit:main"
openrouter-agent-self-test = "openrouter_agent_cli.selftest:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.setuptools]
packages = ["openrouter_agent_cli", "openrouter_agent_cli.eval"]
