version = "1.0"

[task]
name = "xfix/report_pipeline"
authors = [{ name = "openrouter-agent-cli" }]
keywords = ["terminal", "coding", "multi-file", "long-horizon"]
description = "Three coordinated bugs across a 6-file reporting pipeline"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
