version = "1.0"

[task]
name = "xfix/safe_archive_extract"
authors = [{ name = "openrouter-agent-cli" }]
keywords = ["terminal", "coding", "security", "archives", "validation"]
description = "Validate a ZIP archive before extracting it atomically"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
